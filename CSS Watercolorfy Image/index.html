<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Tulip</title>
  </head>
  <body>
    <div class="container">
      <canvas class="canvas js-lines"></canvas>
      <!-- user control -->
      <label class="control">
        Watercolor spread
        <input
          type="range"
          class="js-spread"
          min="0.02"
          max="0.5"
          step="0.01"
          value="0.1"
        />
      </label>
    </div>
    <script src="app.js"></script>
  </body>
</html>
